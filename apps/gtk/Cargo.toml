[package]
name = "ak820-gtk"
description = "GTK3 control app for the AJAZZ / Epomaker AK820 Pro TFT screen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "ak820-gtk"
path = "src/main.rs"

[dependencies]
ak820-proto.workspace = true
ak820-device.workspace = true
ak820-store.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cairo-rs = "0.9"
gdk = "0.13"
gdk-pixbuf = { version = "0.9", features = ["v2_32"] }
glib = { version = "0.10" }
gtk = { version = "0.9", features = ["v3_16"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[lints.rust]
unsafe_code = "forbid"
